name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # SKUFNYA promo prices and the Offer priceValidUntil date are baked in at
  # build time, so rebuild weekly to keep them from drifting out of date.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

# Default for every job. The deploy job overrides this with the narrow set
# of permissions it actually needs; no job gets more than that.
permissions:
  contents: read

# Only one deploy at a time; a newer run waits instead of cancelling the
# running one. Killing a run mid-`deploy-pages` can strand the Pages
# deployment in an "in progress" state that blocks the next deploy, and the
# push and weekly-cron triggers can otherwise overlap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # No later step needs the git token; do not leave it in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Must satisfy the "engines" range in package.json (Astro 7 needs
          # Node >= 22.12).
          node-version: 22
          cache: npm

      - name: Install dependencies (clean install from lockfile)
        run: npm ci

      # All dependencies are dev/build-time only (the site itself is static),
      # so fail the deploy only on high/critical advisories in the toolchain.
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Validate product data
        run: npm run validate:data

      - name: Check types and Astro diagnostics
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      # Post-build artifact checks: metadata uniqueness, JSON-LD validity and
      # consistency with the visible pages, internal links/anchors, branding
      # assets, image fallback wiring, dangerous URL schemes.
      - name: Check build artifact
        run: npm run check:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

      # The generated sitemap is the list of canonical URLs the IndexNow step
      # submits after the deploy succeeds. Passing it as an artifact means
      # that job needs neither a dependency install nor a second build.
      - name: Upload sitemap for the IndexNow step
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sitemap
          path: dist/sitemap.xml
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The only job that needs deployment permissions.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Tells the IndexNow-participating engines (Bing, Yandex, Seznam, Naver,
  # Yep) which URLs to re-fetch, once they are actually live. Google does not
  # participate — it discovers changes through the sitemap. Skipped on the
  # weekly rebuild cron, which republishes identical content.
  indexnow:
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download the built sitemap
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sitemap
          path: dist

      # The submitter has no dependencies beyond Node itself: it reads
      # dist/sitemap.xml and src/data/site.config.mjs, then POSTs once.
      # A rejected ping is reported but never fails an already-live deploy.
      - name: Submit URLs to IndexNow
        run: node scripts/submit-indexnow.mjs
